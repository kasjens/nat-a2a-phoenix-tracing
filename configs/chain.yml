# One agent handing work to another, in a single process, traced as one chain.
# Run with:  nat run --config_file configs/chain.yml --input "..."
#
# Pick a question the model thinks it knows and gets wrong. Asked directly, this model
# says Computerworld's last print issue was 2015; Wikipedia says 2014. The chain gets it
# right, so the handoff is doing visible work rather than just existing. Questions the
# model can answer from memory are worse than useless here: the planner simply answers
# them itself, and you get a two-span trace with no handoff in it at all.
#
# This is the config behind the main demo. Two agents: a planner that owns the
# conversation, and a researcher it delegates lookups to. Because both run in one
# process, Phoenix draws the whole handoff as a single nested tree:
#
#     planner                 <- named below, this is the root span
#       <workflow>            <- nat's own entry-function wrapper, not an agent
#         researcher          <- span name comes from the function key
#           wiki_search
#           wiki_search
#
# Read the tree downwards for the request path, and each span's Output upwards for
# the response path. The answer visibly condenses at every handoff: wiki_search
# returns raw Wikipedia documents, the researcher returns a sentence, the planner
# returns the short answer the user asked for.
#
# See configs/planner.yml and configs/researcher.yml for the same two agents split
# across an A2A hop, where this single tree breaks into two disconnected traces.

general:
  telemetry:
    tracing:
      phoenix:
        _type: phoenix
        endpoint: http://localhost:6006/v1/traces
        project: a2a-demo

llms:
  nim_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    # Model choice is load-bearing here, and most of the catalog does not work:
    #   - meta/llama-3.3-70b-instruct (the original pin) is retired -> HTTP 410 Gone
    #   - gpt-oss-20b returns an empty `content` -> ReActAgentParsingFailedError
    #   - nemotron-3-super / -ultra answer with bare JSON, not Thought:/Action:
    # This one emits clean ReAct text and a final answer with no reasoning preamble.
    temperature: 0.0
    # Reasoning models spend part of this budget before emitting any answer. At 1024,
    # gpt-oss-20b returned an empty completion and the agent died with
    # ReActAgentParsingFailedError "LLM output: ''". Leave headroom.
    max_tokens: 4096

functions:
  wiki_search:
    _type: wiki_search
    max_results: 2

  # Agent B. The function key is what Phoenix shows as the span name, so name these
  # for the audience: `researcher` reads far better in a trace than `agent_2`.
  researcher:
    _type: react_agent
    llm_name: nim_llm
    tool_names:
      - wiki_search
    max_tool_calls: 4
    # The planner picks this agent based on this description, so it is a prompt, not
    # a comment. Say what it is for and what a good question looks like.
    # The planner reads this when deciding whether to delegate, so it is a prompt, not a
    # comment. Strengthening it here is safer than adding instructions to the planner:
    # every attempt at that made the model argue with the ReAct template and fail.
    description: >-
      Authoritative lookup for any question of fact. Searches Wikipedia and returns a
      short, sourced summary. Use this for names, dates, numbers and other specifics
      rather than relying on your own knowledge, which is often out of date or wrong.
      Ask it a single, self-contained question.
    # Without this the model answers well-known questions from memory and the trace
    # has no wiki_search span at all, which is most of what there is to look at.
    additional_instructions: >-
      Always call wiki_search before you answer. Never answer from memory, however
      confident you are. If the searches return nothing useful, say so plainly.
    verbose: true

# Agent A. Owns the conversation and delegates the lookup.
workflow:
  _type: react_agent
  # This names the root span. Without it the root is just `<workflow>` and the tree
  # opens with two spans of the same name, which is unreadable on camera.
  name: planner
  llm_name: nim_llm
  tool_names:
    - researcher
  # nat derives langgraph's recursion limit from this as (max_tool_calls + 1) * 2, so 4
  # gives a budget of 10. The planner sometimes wastes its first delegation by sending
  # both `messages` and `input_message` (the nested agent accepts one or the other), and
  # with only 4 it then ran out and died with "Recursion limit of 10 reached".
  max_tool_calls: 8
  # Without this the planner answers well-known questions itself and never delegates.
  # You then get a two-span trace with no handoff in it, which is the entire demo gone.
  # Asking nicely in the --input is not enough; it has to be in the agent's instructions.
  # Reasoning models on this endpoint intermittently return an empty `content` (the
  # turn lands in `reasoning_content`), which nat reports as
  # ReActAgentParsingFailedError "LLM output: ''". Retry the turn.
  parse_agent_response_max_retries: 3
  verbose: true
