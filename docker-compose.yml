services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"   # UI + OTLP/HTTP collector at /v1/traces
      - "4317:4317"   # OTLP/gRPC, not used by this demo
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix-data:/data

volumes:
  phoenix-data:
